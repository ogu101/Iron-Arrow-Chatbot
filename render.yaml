services:
  - type: web
    name: iron-arrow-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run app.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # means you set this manually in the Render dashboard
      - key: CHUNKS_DIR
        value: ./chunks
      - key: SECTIONS_DIR
        value: ./sections
